<!doctype html>
<html lang="en" class="dark scroll-smooth">

    <script type="application/ld+json">

        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "StreamX",

          "@type": "Offer",
          "price": "0",

  <body class="bg-[#08080B] text-zinc-100 antialiased selection:bg-rose-600/30 selection:text-white">
